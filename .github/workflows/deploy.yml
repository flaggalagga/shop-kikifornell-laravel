name: Deploy to OVH

# Runs after the tests pass on "main", or by hand from the Actions tab.
# Does nothing until the repository variable DEPLOY_ENABLED is "true".
#
# Secrets  (Settings > Secrets and variables > Actions > Secrets):
#   OVH_SSH_HOST         ssh.cluster0XX.hosting.ovh.net
#   OVH_SSH_USER         your OVH FTP/SSH login
#   OVH_SSH_KEY          private key whose public half is in ~/.ssh/authorized_keys on OVH
#   OVH_SSH_KNOWN_HOSTS  output of: ssh-keyscan ssh.cluster0XX.hosting.ovh.net
# Variables (Settings > Secrets and variables > Actions > Variables):
#   DEPLOY_ENABLED       true
#   OVH_DEPLOY_PATH      folder of the app on the hosting, e.g. shop-laravel   (relative to the FTP root)
#   OVH_PHP_BIN          php binary on OVH, e.g. php or /usr/local/php8.5/bin/php  (default: php)

on:
  workflow_run:
    workflows: [Tests]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, intl, zip
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          SSH_USER: ${{ secrets.OVH_SSH_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # One host alias for every ssh/rsync call below. BatchMode: never fall back to a password.
          printf 'Host ovh\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config

          # Fingerprints are not secret: compare them with the key on OVH (ssh-keygen -lf ~/.ssh/authorized_keys).
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub 2>/dev/null; then
            echo "::error::OVH_SSH_KEY is not a valid private key. Paste the whole content of the key file WITHOUT .pub, including the BEGIN and END lines."
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/id_deploy.pub)"
          echo "Server name: $SSH_HOST"
          echo "Known host entries: $(grep -c . ~/.ssh/known_hosts)"

          if ! ssh ovh true; then
            echo "::error::OVH refused the deploy key. Check that the public key with the fingerprint above is in ~/.ssh/authorized_keys on OVH (chmod 700 ~/.ssh, chmod 600 ~/.ssh/authorized_keys) and that OVH_SSH_USER is the OVH login (not a local alias)."
            exit 1
          fi

      - name: Maintenance mode on
        env:
          APP_DIR: ${{ vars.OVH_DEPLOY_PATH }}
          PHP_BIN: ${{ vars.OVH_PHP_BIN || 'php' }}
        run: |
          ssh ovh "cd \"$APP_DIR\" 2>/dev/null && [ -f artisan ] && $PHP_BIN artisan down --retry=30 || true"

      - name: Upload files
        env:
          APP_DIR: ${{ vars.OVH_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git/' --exclude='.github/' --exclude='tests/' --exclude='node_modules/' \
            --exclude='.env' --exclude='storage/' --exclude='public/storage' \
            --exclude='database/database.sqlite' \
            ./ "ovh:$APP_DIR/"

      - name: Migrate and cache
        env:
          APP_DIR: ${{ vars.OVH_DEPLOY_PATH }}
          PHP_BIN: ${{ vars.OVH_PHP_BIN || 'php' }}
        run: |
          ssh ovh bash -s <<EOF
          set -e
          cd "$APP_DIR"
          mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          if [ ! -f .env ]; then
            echo "Code uploaded. First deploy: run 'bash deploy/first-install.sh https://your-site' over SSH in ~/$APP_DIR."
            exit 0
          fi
          $PHP_BIN artisan migrate --force
          [ -e public/storage ] || $PHP_BIN artisan storage:link
          $PHP_BIN artisan optimize
          $PHP_BIN artisan filament:optimize
          $PHP_BIN artisan up
          EOF
